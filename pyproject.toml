[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "browserapi-lab"
version = "0.13.0"
description = "Laboratorio Linux leve para pesquisar, testar e medir automacao, streaming e extracao de respostas em interfaces web de chats de IA."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["playwright==1.64.1"]

[project.scripts]
browserapi-lab = "browserapi_lab.cli:main"
browserapi-window = "browserapi_lab.gui:main"

[tool.setuptools]
packages = ["browserapi_lab"]

[tool.setuptools.package-data]
browserapi_lab = ["assets/*.js", "assets/*.html", "assets/*.css"]
