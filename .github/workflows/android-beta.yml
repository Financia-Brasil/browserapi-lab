name: Android beta — build remoto
on:
  push:
    branches: ["codex/farol-android-beta-20261115"]
    paths: ["android/**", "backend/**", ".github/workflows/android-beta.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-beta-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: "13114758"
          packages: "platform-tools"
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Restaurar assinatura estável de teste
        env:
          FAROL_TEST_KEYSTORE_BASE64: ${{ secrets.FAROL_TEST_KEYSTORE_BASE64 }}
        run: |
          test -n "$FAROL_TEST_KEYSTORE_BASE64"
          mkdir -p "$HOME/.android"
          printf '%s' "$FAROL_TEST_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Testes do gateway de IA
        run: python3 -m unittest discover -s backend -p 'test_*.py' -v
      - name: Testes de captura e privacidade
        working-directory: android/test-web
        run: npm ci --ignore-scripts && npm test
      - name: Testes Kotlin, lint e APK
        working-directory: android
        run: gradle --no-daemon --max-workers=2 testDebugUnitTest lintDebug assembleDebug
      - name: Registrar hash do APK
        run: |
          mkdir -p android/artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk android/artifacts/Farol-0.2.0-beta.apk
          cp android/fixture/build/outputs/apk/debug/fixture-debug.apk android/artifacts/Farol-Exercicio.apk
          cd android/artifacts
          sha256sum Farol-0.2.0-beta.apk Farol-Exercicio.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: farol-beta-${{ github.sha }}
          path: |
            android/artifacts/
            android/app/build/reports/
            android/app/build/test-results/
          retention-days: 14
          if-no-files-found: warn
