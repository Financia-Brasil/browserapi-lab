name: lab

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: "Nucleo Python (sem navegador)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Auditoria do ambiente
        run: python -m browserapi_lab.cli doctor --json results/samples/doctor-ci.json

      - name: Testes do nucleo (unittest)
        run: python -m unittest discover -s tests -v

      - name: Publicar relatorios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-${{ github.run_id }}
          path: results/
          if-no-files-found: ignore

  browser:
    name: "Integracao real com Chromium"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar Playwright e Chromium
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Auditoria do ambiente
        run: python -m browserapi_lab.cli doctor --json results/samples/doctor-ci-browser.json

      - name: Bateria de integracao com navegador
        run: python -m unittest discover -s tests -v

      - name: Publicar evidencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-navegador-${{ github.run_id }}
          path: results/
          if-no-files-found: ignore
